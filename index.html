
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Re+ helps you organize tasks, events, and your time.">
  <title>Re+ — Organize your life</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #171717;
      line-height: 1.6;
    }

    header {
      width: 100%;
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eeeeee;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    header a {
      color: #171717;
      text-decoration: none;
      font-weight: 600;
    }

    main {
      min-height: 78vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 80px 20px;
    }

    .tag {
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(44px, 8vw, 76px);
      line-height: 1.05;
      letter-spacing: -3px;
      max-width: 800px;
      margin-bottom: 22px;
    }

    .description {
      max-width: 540px;
      color: #666;
      font-size: 18px;
      margin-bottom: 34px;
    }

    .downloads {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .download-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 190px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #171717;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 650;
      border: 1px solid #171717;
      transition: transform 0.2s, background 0.2s;
    }

    .download-button:hover {
      transform: translateY(-2px);
      background: #333;
    }

    .download-button.secondary {
      background: white;
      color: #171717;
      border-color: #dddddd;
    }

    .download-button.secondary:hover {
      background: #f7f7f7;
    }

    .download-button.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    #download-status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 13px;
      color: #777;
    }

    footer {
      border-top: 1px solid #eeeeee;
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      color: #777;
      font-size: 13px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 6%;
      }

      main {
        padding: 64px 20px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .description {
        font-size: 16px;
      }

      .downloads {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        max-width: 320px;
      }

      footer {
        padding: 20px 6%;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="#" class="logo">Re+</a>
    <a href="https://github.com/lorenzocesarini-tech/replus-website/releases"
       target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </header>

  <main>
    <p class="tag">A simpler way to stay organized</p>

    <h1>Your life.<br>Organized.</h1>

    <p class="description">
      Re+ helps you organize your tasks, manage your time,
      and focus on what matters.
    </p>

    <div class="downloads">
      <a id="mac-download"
         class="download-button disabled"
         href="#"
         aria-label="Download Re+ for macOS">
        Loading macOS download...
      </a>

      <a id="windows-download"
         class="download-button secondary disabled"
         href="#"
         aria-label="Download Re+ for Windows">
        Windows — Coming soon
      </a>
    </div>

    <p id="download-status" role="status" aria-live="polite">
      Finding the latest version...
    </p>
  </main>

  <footer>
    <span>© 2026 Re+</span>
    <a href="https://github.com/lorenzocesarini-tech/replus-website/releases"
       target="_blank" rel="noopener noreferrer">All releases</a>
  </footer>

  <script>
    // GitHub repository containing the releases.
    const GITHUB_OWNER = "lorenzocesarini-tech";
    const GITHUB_REPO = "replus-website";

    const API_URL =
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases`;

    const RELEASES_URL =
      `https://github.com/${GITHUB_OWNER}/${GITHUB_REPO}/releases`;

    const macButton = document.getElementById("mac-download");
    const windowsButton = document.getElementById("windows-download");
    const statusText = document.getElementById("download-status");

    function isZip(asset) {
      return asset.name.toLowerCase().endsWith(".zip");
    }

    function identifyPlatform(filename) {
      const name = filename.toLowerCase();

      if (/(macos|mac-os|mac_os|mac\b|darwin|osx|apple)/i.test(name)) {
        return "mac";
      }

      if (/(windows|win32|win64|win\b|\.exe\b|\.msi\b)/i.test(name)) {
        return "windows";
      }

      return "unknown";
    }

    async function loadDownloads() {
      try {
        const response = await fetch(API_URL, {
          cache: "no-store",
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error(`GitHub API returned ${response.status}`);
        }

        const releases = await response.json();

        // Use the newest published stable release, not an older version.
        const stableReleases = releases
          .filter(release =>
            !release.draft &&
            !release.prerelease &&
            release.assets
          )
          .sort((a, b) => {
            const dateA = new Date(a.published_at || a.created_at).getTime();
            const dateB = new Date(b.published_at || b.created_at).getTime();
            return dateB - dateA;
          });

        if (stableReleases.length === 0) {
          throw new Error("No published stable release was found.");
        }

        const latest = stableReleases[0];
        const zipAssets = latest.assets.filter(isZip);

        // Prefer an asset whose filename explicitly identifies macOS.
        let macAsset = zipAssets.find(
          asset => identifyPlatform(asset.name) === "mac"
        );

        // If there is exactly one ZIP, use it as macOS even if renamed.
        // This matches the current setup: one ZIP per release.
        if (!macAsset && zipAssets.length === 1) {
          macAsset = zipAssets[0];
        }

        // Never guess which of multiple unrecognized ZIPs is for macOS.
        if (macAsset) {
          macButton.href = macAsset.browser_download_url;
          macButton.textContent = "Download for macOS";
          macButton.classList.remove("disabled");
          macButton.setAttribute("aria-label",
            `Download Re+ for macOS, ${latest.tag_name}`);
        } else {
          macButton.href = RELEASES_URL;
          macButton.textContent = "Find macOS download";
          macButton.classList.remove("disabled");
          statusText.textContent =
            "Couldn't identify the macOS ZIP in the latest release.";
        }

        // Windows remains separate. It is enabled when a Windows ZIP
        // can be identified by its filename.
        const windowsAsset = zipAssets.find(
          asset => identifyPlatform(asset.name) === "windows"
        );

        if (windowsAsset) {
          windowsButton.href = windowsAsset.browser_download_url;
          windowsButton.textContent = "Download for Windows";
          windowsButton.classList.remove("disabled");
        } else {
          windowsButton.href = "#";
          windowsButton.textContent = "Windows — Coming soon";
          windowsButton.classList.add("disabled");
        }

        if (macAsset) {
          statusText.textContent =
            `Latest version: ${latest.tag_name}`;
        }

      } catch (error) {
        console.error("Unable to load Re+ downloads:", error);

        // Keep a working route to the releases page if the API fails.
        macButton.href = RELEASES_URL;
        macButton.textContent = "Get Re+ on GitHub";
        macButton.classList.remove("disabled");

        statusText.textContent =
          "Couldn't load downloads automatically. Open GitHub releases instead.";
      }
    }

    loadDownloads();
  </script>
</body>
</html>
