
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re+ — Organizza. Focalizzati. Cresci.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 720px; text-align: center; }
    .logo {
      display: inline-grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #1685f8;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 18px;
    }
    h1 { font-size: clamp(42px, 8vw, 68px); margin: 0 0 12px; }
    h1 span { color: #3294ff; }
    p { color: #bdc8d8; line-height: 1.7; }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    a {
      background: #1685f8;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 650;
    }
    a.secondary { background: #202d40; }
    small { display: block; margin-top: 32px; color: #8492a6; }
  </style>
</head>
<body>
  <main>
    <div class="logo">R+</div>
    <h1>Meet <span>Re+</span></h1>
    <p><strong>Organizza. Focalizzati. Cresci.</strong></p>
    <p>Le tue task, i tuoi eventi e i tuoi obiettivi, organizzati in un unico posto.</p>
    <div class="buttons">
      <a href="https://github.com/lorenzocesarini-tech/replus-website/releases/download/v1.0.6/RePlus-macOS.zip">Scarica per macOS</a>
      <a class="secondary" href="#windows">Scarica per Windows</a>
    </div>
    <small>Re+ · La tua organizzazione, con un nuovo ritmo.</small>
  </main>
</body>
</html>
